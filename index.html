<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101522" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Хогвартс: история</title>
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/icon-180.png" />
    <link rel="stylesheet" href="./styles/app.css" />
  </head>
  <body>
    <div id="file-protocol-warning" class="file-warning" hidden>
      <div class="modal-card">
        <h1 class="modal-title">Запустите через локальный сервер</h1>
        <p class="modal-subtitle">
          Файл <code>index.html</code> открыт напрямую (<code>file://</code>). Браузер блокирует ES-модули без HTTP-сервера.
        </p>
        <p class="modal-subtitle">
          Выполните в PowerShell из папки <code>novel_hogwarts</code>:<br />
          <code>.\novel\.venv\Scripts\python.exe -m http.server 8000 --bind 0.0.0.0 --directory novel</code><br />
          и откройте <code>http://localhost:8000</code>.
        </p>
      </div>
    </div>

    <script>
      if (window.location.protocol === 'file:') {
        var warn = document.getElementById('file-protocol-warning');
        if (warn) warn.hidden = false;
      }
    </script>

    <main id="app" class="app-shell">
      <section id="stage-root" class="stage-viewport" aria-label="Сцена"></section>
      <div id="hud-root" class="hud-root" role="toolbar" aria-label="Управление"></div>
      <section id="dialogue-root" class="dialogue-panel" aria-live="polite"></section>
    </main>

    <div id="modal-root" class="modal-backdrop" hidden></div>
    <div id="toast-root" class="toast-container" aria-live="assertive"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
